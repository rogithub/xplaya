[package]
name = "xplaya"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
minijinja = { version = "2", features = ["loader", "json"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower = "0.4"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "rust_decimal", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
