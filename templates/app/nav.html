{#
  Barra de abajo de la app: Monedero · Tienda · Carrito. La incluye app/base.html cuando la
  página pasa `nav` (la pestaña activa). El número del carrito sale del store de cart.js.
#}
<nav class="app-nav" aria-label="Secciones de la app">
    <a href="/" {% if nav == "monedero" %}class="activo" aria-current="page"{% endif %}>
        <span class="app-nav-ico" aria-hidden="true">💳</span>Monedero
    </a>
    <a href="/tienda" {% if nav == "tienda" %}class="activo" aria-current="page"{% endif %}>
        <span class="app-nav-ico" aria-hidden="true">🛍️</span>Tienda
    </a>
    <a href="/carrito" {% if nav == "carrito" %}class="activo" aria-current="page"{% endif %} x-data>
        <span class="app-nav-ico" aria-hidden="true">🛒</span>Carrito
        <span class="app-nav-badge" x-show="$store.carrito.total > 0" x-text="$store.carrito.total" x-cloak></span>
    </a>
</nav>
