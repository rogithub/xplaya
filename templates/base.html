<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}xplaya.com{% endblock %}</title>
    {% block meta_description %}<meta name="description" content="Papelería y mercería en Playa del Carmen — copias, trámites, engargolados, enmicados, escáner y WIFI gratis.">{% endblock %}
    <meta name="keywords" content="papelería, copias, mercería, trámites, engargolados, enmicados, escáner, WIFI, villas del sol, palmas turquesa, playa del carmen">
    <meta name="author" content="xplaya.com">
    <meta name="theme-color" content="#E85D04">

    {% block meta_social %}
    <meta property="og:site_name" content="xplaya.com">
    <meta property="og:locale" content="es_MX">
    <meta property="og:image" content="{{ site_url }}/static/img/logocircle.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ site_url }}/static/img/logocircle.png">
    {% endblock %}

    <meta itemprop="name" content="Papelería xplaya.com">
    <meta itemprop="description" content="Copias, trámites, engargolados, enmicados, escáner, WIFI gratis para enviar documentos">
    <meta itemprop="image" content="{{ site_url }}/static/img/circleai.jpg">

    {% block head %}{% endblock %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
    {# Alpine debe cargarse antes de que el DOM esté listo para capturar alpine:init #}
    <script src="/static/js/cart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Papelería xplaya.com",
      "image": "{{ site_url }}/static/img/papeleria.png",
      "logo": "{{ site_url }}/static/img/logocircle.png",
      "url": "{{ site_url }}",
      "telephone": "+52-452-201-8336",
      "email": "papeleria@xplaya.com",
      "priceRange": "$",
      "currenciesAccepted": "MXN",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Villas del Sol, a un costado de Palmas Turquesa",
        "addressLocality": "Playa del Carmen",
        "addressRegion": "Quintana Roo",
        "postalCode": "77726",
        "addressCountry": "MX"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 20.6772444,
        "longitude": -87.1119174
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "06:30",
          "closes": "18:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "09:00",
          "closes": "14:00"
        }
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "xplaya.com",
      "url": "{{ site_url }}",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "{{ site_url }}/productos?busqueda={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
</head>
<body>
    <nav class="navbar is-light" role="navigation" x-data="{ open: false }">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-item" href="/productos">
                    <strong>xplaya.com</strong>
                </a>
                <a role="button" class="navbar-burger" :class="{ 'is-active': open }"
                   @click="open = !open" aria-label="menú">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
            </div>
            <div class="navbar-menu" :class="{ 'is-active': open }">
                <div class="navbar-start">
                    <a class="navbar-item" href="/productos">Catálogo</a>
                </div>
                <div class="navbar-end">
                    <a class="navbar-item" href="/carrito">
                        Carrito
                        <span class="tag is-success is-rounded ml-2"
                              x-show="$store.carrito.total > 0"
                              x-text="$store.carrito.total"
                              style="display: none;"></span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="section">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="content has-text-centered">
            <p>
                <strong>xplaya.com</strong> &mdash;
                <a href="/terminos">Términos y condiciones</a>
            </p>
        </div>
    </footer>
</body>
</html>
