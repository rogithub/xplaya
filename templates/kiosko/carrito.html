{% extends "kiosko/base.html" %}
{% block title %}Carrito — Kiosko xplaya.com{% endblock %}
{% block content %}

<div x-data="kioskoCarrito()">

    <div class="is-flex is-align-items-center mb-5" style="gap: 1rem;">
        <a class="button is-medium" href="/kiosko" x-show="!confirmado">
            <span class="icon"><i class="fas fa-arrow-left"></i></span>
            <span>Seguir viendo</span>
        </a>
        <h1 class="title is-3 mb-0">Tu carrito</h1>
    </div>

    {# Carrito vacío #}
    <template x-if="$store.carrito.items.length === 0 && !confirmado">
        <div class="has-text-centered py-6">
            <p class="is-size-4 has-text-grey mb-5">Tu carrito está vacío.</p>
            <a href="/kiosko" class="button is-success is-large">Ver catálogo</a>
        </div>
    </template>

    {# Confirmación de pedido #}
    <template x-if="confirmado">
        <div class="notification is-success has-text-centered py-6">
            <h2 class="title is-3">¡Pedido recibido!</h2>
            <p class="is-size-5">El personal te atenderá en un momento.</p>
            <a href="/kiosko" class="button is-white is-large mt-5">Nueva consulta</a>
        </div>
    </template>

    {# Carrito con items #}
    <template x-if="$store.carrito.items.length > 0 && !confirmado">
        <div>
            <template x-for="item in $store.carrito.items" :key="item._key">
                <div class="box is-flex is-align-items-center" style="gap: 1.25rem;">
                    <div style="flex: 1;">
                        <p class="has-text-weight-semibold is-size-5" x-text="item.nombre"></p>
                        <p class="is-size-6 has-text-grey"
                           x-text="'$' + item.precio + ' por ' + item.unidad_medida"></p>
                    </div>

                    {# Stepper táctil: − no baja de 1; quitar es siempre acción explícita #}
                    <div class="is-flex is-align-items-center" style="gap: .5rem;">
                        <button class="button is-large" aria-label="menos"
                                :disabled="item.cantidad <= 1"
                                @click="$store.carrito.cambiarCantidad(item._key, item.cantidad - 1)">
                            <span class="icon"><i class="fas fa-minus"></i></span>
                        </button>
                        <span class="is-size-4 has-text-weight-bold has-text-centered"
                              style="min-width: 3rem;" x-text="item.cantidad"></span>
                        <button class="button is-large" aria-label="más"
                                @click="$store.carrito.cambiarCantidad(item._key, item.cantidad + 1)">
                            <span class="icon"><i class="fas fa-plus"></i></span>
                        </button>
                    </div>

                    <p class="is-size-4 has-text-weight-bold has-text-success has-text-right"
                       style="min-width: 7rem;"
                       x-text="'$' + (parseFloat(item.precio) * item.cantidad).toFixed(2)"></p>

                    <button class="button is-danger is-medium"
                            @click="$store.carrito.quitar(item._key)">
                        <span class="icon"><i class="fas fa-trash-can"></i></span>
                        <span>Quitar</span>
                    </button>
                </div>
            </template>

            <div class="is-flex is-justify-content-space-between is-align-items-center px-4 mb-5">
                <span class="is-size-4">Total estimado</span>
                <span class="is-size-2 has-text-weight-bold has-text-success"
                      x-text="'$' + $store.carrito.subtotal"></span>
            </div>

            {# Sin formulario: el kiosko no captura datos del cliente. El pedido
               llega al POS a nombre de "Kiosko en tienda" y el vendedor pide o
               verifica el teléfono al cobrar — ahí se liga el cliente real. #}
            <div x-show="error" class="notification is-danger is-light mb-4">
                <span x-text="error"></span>
            </div>

            <div class="has-text-centered">
                <button class="button is-success is-large px-6"
                        :class="{ 'is-loading': enviando }"
                        @click="enviar()">
                    <span class="icon"><i class="fas fa-paper-plane"></i></span>
                    <span>Enviar pedido al mostrador</span>
                </button>
                <p class="is-size-6 has-text-grey mt-3">Pagas al recogerlo en el mostrador.</p>
            </div>
        </div>
    </template>

</div>

<script>
function kioskoCarrito() {
    return {
        enviando: false,
        confirmado: false,
        error: null,

        async enviar() {
            this.error = null;
            this.enviando = true;

            const items = this.$store.carrito.items.map(i => ({
                producto_id: i.id,
                cantidad: i.cantidad,
                presentacion_id: i.presentacion_id || null,
            }));

            try {
                // La autorización viaja en la cookie HttpOnly del kiosko
                // (sembrada por /kiosko/activar) — el fetch la manda solo.
                const res = await fetch('/kiosko/pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items }),
                });

                if (!res.ok) {
                    this.error = await res.text() || 'Error al enviar el pedido.';
                    return;
                }

                this.$store.carrito.vaciar();
                this.confirmado = true;
            } catch {
                this.error = 'Error de conexión. Intenta de nuevo.';
            } finally {
                this.enviando = false;
            }
        },
    };
}
</script>

{% endblock %}
