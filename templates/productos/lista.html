{% extends "base.html" %}
{% block title %}Catálogo{% endblock %}
{% block meta_social %}
<meta property="og:site_name" content="xplaya.com">
<meta property="og:locale" content="es_MX">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site_url }}/productos">
<meta property="og:title" content="Catálogo — xplaya.com">
<meta property="og:description" content="Material escolar, de oficina y más. Compra en línea en Papelería xplaya.com.">
<meta property="og:image" content="{{ site_url }}/static/img/logocircle.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="{{ site_url }}/static/img/logocircle.png">
{% endblock %}
{% block content %}

<div class="level mb-5">
    <div class="level-left">
        <h1 class="title">Catálogo</h1>
    </div>
    <div class="level-right">
        <div class="field">
            <div class="control">
                <input class="input"
                       type="search"
                       name="busqueda"
                       value="{{ busqueda }}"
                       placeholder="Buscar productos..."
                       hx-get="/productos"
                       hx-target="#catalogo"
                       hx-trigger="input changed delay:400ms, search"
                       hx-push-url="true">
            </div>
        </div>
    </div>
</div>

<div id="catalogo">
    {% include "productos/partials/grid.html" %}
</div>

{% endblock %}
