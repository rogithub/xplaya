<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo Papelería (circular, PAPE / LERIA). Fondo transparente; cada letra es un path independiente. Ver los colores en el bloque style. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545.45 545.45" role="img" aria-labelledby="pap-title">
  <title id="pap-title">Papelería</title>
  <style>
    /* Pintar inline con CSS: --papeleria-teal, --papeleria-yellow, --papeleria-orange (por color)
       o --papeleria-1 a --papeleria-9 (una por letra). Como imagen (img) o en un editor (Inkscape, Illustrator,
       Figma) se usan los fill de cada path. */
    .pap-1{fill:var(--papeleria-1,var(--papeleria-teal,#7DC5C3))}
    .pap-2{fill:var(--papeleria-2,var(--papeleria-yellow,#EBB728))}
    .pap-3{fill:var(--papeleria-3,var(--papeleria-orange,#EC652A))}
    .pap-4{fill:var(--papeleria-4,var(--papeleria-teal,#7DC5C3))}
    .pap-5{fill:var(--papeleria-5,var(--papeleria-yellow,#EBB728))}
    .pap-6{fill:var(--papeleria-6,var(--papeleria-orange,#EC652A))}
    .pap-7{fill:var(--papeleria-7,var(--papeleria-teal,#7DC5C3))}
    .pap-8{fill:var(--papeleria-8,var(--papeleria-yellow,#EBB728))}
    .pap-9{fill:var(--papeleria-9,var(--papeleria-teal,#7DC5C3))}
    .pap-ring{stroke:var(--papeleria-ring,#A0603E)}
    .pap-disc{fill:var(--papeleria-disc,none)}
  </style>
